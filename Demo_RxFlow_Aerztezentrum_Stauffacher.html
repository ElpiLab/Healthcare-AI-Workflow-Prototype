<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RxFlow · Ärztezentrum am Stauffacher</title><style>
:root{--bg:#f5f7f9;--paper:#fff;--ink:#17252c;--sub:#667782;--line:#e1e8eb;--blue:#245d65;--blue2:#e9f3f3;--ok:#247454;--okbg:#edf8f1;--amber:#9e641b;--amberbg:#fff7e9;--red:#ae4645;--redbg:#fff0ef;--shadow:0 8px 30px rgba(19,40,52,.045)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:19px 24px;gap:16px}.brand{display:flex;gap:13px;align-items:center}.mark{background:var(--blue);width:41px;height:41px;border-radius:12px;color:white;display:grid;place-items:center;font-size:22px;font-weight:700}.brandname{font-size:20px;font-weight:780;letter-spacing:-.6px;line-height:1.1}.brandnote{color:var(--sub);font-size:12px;margin-top:4px}.nav{display:flex;border:1px solid var(--line);background:#f8fafb;padding:4px;border-radius:12px;gap:2px}.nav button{border:0;background:transparent;padding:9px 14px;color:var(--sub);border-radius:9px;font-weight:650;font-size:13px}.nav button.active{background:white;color:var(--blue);box-shadow:0 1px 7px #1c323310}main{max-width:1160px;margin:auto;padding:34px 24px 70px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:23px}.eyebrow{text-transform:uppercase;letter-spacing:1.65px;font-size:11px;font-weight:780;color:var(--blue)}h1{font-size:28px;letter-spacing:-.95px;margin:6px 0 3px;font-weight:780}h2{font-size:21px;letter-spacing:-.5px;margin:0}h3{font-size:15px;margin:0 0 14px}p{margin:5px 0;color:var(--sub)}.small{font-size:12px;color:var(--sub)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.pad{padding:26px}.patient{max-width:650px;margin:0 auto}.stephead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:12px;color:var(--sub)}.progress{display:flex;gap:5px;margin-top:11px}.progress span{height:4px;background:#e9eeef;border-radius:20px;flex:1}.progress span.done{background:var(--blue)}.question{font-size:25px;letter-spacing:-.8px;line-height:1.24;font-weight:750;margin:22px 0 12px}.opt{width:100%;background:white;border:1px solid var(--line);border-radius:11px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:9px 0;color:var(--ink);transition:.15s}.opt:hover,.opt.selected{border-color:#76a4a7;background:#f2f8f8}.opt .muted{color:var(--sub);display:block;font-size:12px;margin-top:3px}.symbol{color:var(--blue);font-size:21px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn{border:1px solid transparent;border-radius:10px;background:var(--blue);color:white;font-weight:680;padding:12px 18px;min-height:43px}.btn:hover{filter:brightness(.96)}.btn.ghost{background:#fff;color:var(--blue);border-color:var(--line)}.btn.success{background:var(--ok)}.btn.danger{background:var(--red)}.btn.tiny{padding:8px 12px;min-height:32px;font-size:12px}.hint{font-size:13px;color:var(--sub);margin-top:7px}.field{display:block;font-size:12px;font-weight:720;margin:13px 0 6px}.inp{width:100%;border:1px solid #d5e0e3;border-radius:9px;padding:12px 13px;outline:none;background:#fff}.inp:focus{border-color:#48858a;box-shadow:0 0 0 3px #48858a19}textarea.inp{min-height:100px;resize:vertical}.notice{border-radius:11px;padding:15px 17px;background:#f1f5f6;border:1px solid #e5ecee;margin-top:17px;font-size:13px}.notice.warn{background:var(--amberbg);border-color:#f1dfc6;color:#77501e}.notice.good{background:var(--okbg);border-color:#d6e9dd;color:#18593f}.notice.danger{background:var(--redbg);border-color:#f0d0ce;color:#843632}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.four{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;min-height:195px}.stat h3{display:flex;align-items:center;gap:9px;margin:0 0 15px}.ico{width:27px;height:27px;border-radius:8px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-size:15px}.line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f1;font-size:13px}.line:last-child{border:0}.labrow{display:grid;grid-template-columns:minmax(0,1.25fr) auto auto;gap:8px;align-items:center;border-bottom:1px solid #edf0f1;padding:8px 0;font-size:11px}.labrow strong{white-space:nowrap}.lang{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font-weight:650;padding:9px;font-size:12px}.line strong{font-weight:650}.muted{color:var(--sub)}.tag{display:inline-block;font-size:11px;font-weight:750;padding:5px 9px;border-radius:7px;background:#edf2f3;color:#49626a;white-space:nowrap}.tag.warn{background:var(--amberbg);color:var(--amber)}.tag.red{background:var(--redbg);color:var(--red)}.tag.green{background:var(--okbg);color:var(--ok)}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.dashgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}.queue{padding:12px}.queue-group-title{display:flex;align-items:center;justify-content:space-between;padding:13px 8px 8px;margin-top:6px;border-bottom:1px solid var(--line);font-size:13px}.queue-group-title:first-child{margin-top:0}.deliverybox{padding:18px;border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#f9fbfb}.deliverybox h3{margin:6px 0 8px;font-size:18px}.queueitem{border:1px solid transparent;border-radius:10px;padding:13px;cursor:pointer;margin-bottom:6px}.queueitem:hover{background:#f5f8f9}.queueitem.active{background:#eaf3f3;border-color:#d6e7e7}.queueitem .row{align-items:start}.queueitem b{font-size:13px}.queueitem p{font-size:12px;margin:4px 0}.caseheader{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:15px}.medhero{border-radius:12px;background:#f5f8f9;padding:18px 19px;margin:12px 0 14px}.medhero b{font-size:20px;letter-spacing:-.4px}.medhero .small{display:block;margin-top:3px}.links{color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:12px;text-align:left}.taskbox{background:#f6f8f9;border:1px solid var(--line);border-radius:12px;padding:17px}.taskbox h3{margin-bottom:8px}.taskbox label{display:block;font-size:13px;padding:7px 0}.taskbox input[type=radio]{accent-color:var(--blue)}.emptystate{text-align:center;padding:42px 20px;color:var(--sub)}.emptystate b{display:block;color:var(--ink);margin-bottom:6px}.foot{font-size:11px;color:#8a999f;text-align:center;margin-top:38px}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.hr{border-top:1px solid var(--line);margin:19px 0}.toptools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.appicon{font-size:18px;color:var(--blue)}@media(max-width:850px){.head{flex-direction:column;align-items:stretch}.nav{justify-content:center}.nav button{flex:1}.dashgrid{grid-template-columns:1fr}.queue{max-height:240px;overflow:auto}.intro{align-items:flex-start;flex-direction:column}.four{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:24px 13px 55px}.head{padding:14px 13px}.pad{padding:20px 16px}.four,.two{grid-template-columns:1fr}.question{font-size:22px}.stat{min-height:0}.btn{font-size:13px;padding:11px 12px}.nav button{padding:10px 7px;font-size:12px}.caseheader{flex-direction:column}}
.visitcard{padding:17px;border:1px solid var(--line);background:#fff;border-radius:12px;margin:13px 0}.visitcard .choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.visitcard .choice .opt{margin:9px 0 7px;font-size:13px;padding:12px}.fileline{margin-top:10px;color:var(--ok);font-size:13px}.addvisit{width:100%;margin-top:6px}.wrap{flex-wrap:wrap}.visitcard .small{line-height:1.8;margin:9px 0}.visitcard .links{margin-top:8px}@media(max-width:520px){.visitcard .choice{grid-template-columns:1fr}.visitcard .choice .opt{margin:3px 0}}
</style></head><body><header><div class="head"><div class="brand"><div class="mark">R<span style="font-size:16px;font-weight:400">+</span></div><div><div class="brandname">RxFlow</div><div class="brandnote">Ärztezentrum am Stauffacher · Hausarztmedizin</div></div></div><nav class="nav"><button data-view="patient" class="active">Patientenportal</button><button data-view="mpa">MPA</button><button data-view="doctor">Ärztliche Prüfung</button></nav><select class="lang" id="langSelect" aria-label="Sprache" onchange="setLanguage(this.value)"><option value="DE">DE</option><option value="FR">FR</option><option value="EN">EN</option><option value="IT">IT</option></select></div></header><main id="app"></main><script>
'use strict';
const practice={name:'Ärztezentrum am Stauffacher',phone:'044 555 41 80'};
const meds=[{id:'ram',name:'Ramipril 5 mg',dose:'1 Tablette morgens',valid:false},{id:'ato',name:'Atorvastatin 20 mg',dose:'1 Tablette abends',valid:true},{id:'bis',name:'Bisoprolol 5 mg',dose:'1 Tablette morgens',valid:false}];
let requests=[],view='patient',step=0,selectedId=null,taskOpen=false;
let draft=emptyDraft();let uploads={};let language="DE";
function emptyDraft(){return {med:'',symptoms:null,symptomText:'',external:null,visits:[],delivery:'email',contactEmail:'anna.keller@beispiel.ch',contactAddress:'Lindenstrasse 18, 8003 Zürich',pharmacy:''}}
function newVisit(){return {id:uid(),mode:'request',doctor:'',specialty:'',address:'',reason:'',date:'',filename:'',fileReady:false,status:'new',pisName:''}}
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);const today=()=>new Date().toLocaleDateString('de-CH');
function nav(v){view=v;taskOpen=false;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
function reset(){draft=emptyDraft();step=0;render()}
function selectMed(m){draft.med=m;if(m==='other'){step=5}else if(meds.find(x=>x.id===m)?.valid){step=4}else{step=1}render()}
function next(){
 if(step===1){if(draft.symptoms===null)return alert('Bitte wählen Sie Ja oder Nein.');if(draft.symptoms===true&&!draft.symptomText.trim())return alert('Bitte beschreiben Sie Ihre Beschwerden kurz.');step=2}
 else if(step===2){if(draft.external===null)return alert('Bitte wählen Sie Ja oder Nein.');if(draft.external&&!draft.visits.length)draft.visits.push(newVisit());step=draft.external?3:6}
 else if(step===3){for(const v of draft.visits){if(v.mode==='request'&&(!v.doctor.trim()||!v.specialty.trim()||!v.address.trim()||!v.reason.trim()||!v.date))return alert('Bitte die Angaben zur externen Behandlung ergänzen.');if(v.mode==='upload'&&!v.fileReady)return alert('Bitte einen Bericht als Datei auswählen.')}step=6}
 else if(step===6){if(draft.delivery==='email'&&!/^\S+@\S+\.\S+$/.test(draft.contactEmail.trim()))return alert('Bitte eine gültige E-Mail-Adresse angeben.');if(draft.delivery==='post'&&!draft.contactAddress.trim())return alert('Bitte die Postadresse angeben.');if(draft.delivery==='pharmacy'&&!draft.pharmacy.trim())return alert('Bitte geben Sie die Apotheke an.');step=8}
 else if(step===8){submit();return}render()
}
function back(){if(step===8)step=6;else if(step===3)step=2;else if(step===6)step=draft.external?3:2;else step=Math.max(0,step-1);render()}
function submit(){const m=meds.find(x=>x.id===draft.med);if(!m)return;
const visits=draft.external?draft.visits.map(v=>({...v,status:'new'})):[];
const r={id:uid(),name:'Anna Keller',age:68,med:m.name,dose:m.dose,symptoms:draft.symptoms,symptomText:draft.symptomText.trim(),external:draft.external,visits,status:draft.external?'mpa':'doctor',report:draft.external?'MPA-Prüfung':'nicht erforderlich',comment:'',created:today(),signed:false,task:null,delivery:draft.delivery,contact:draft.delivery==='email'?draft.contactEmail:draft.delivery==='post'?draft.contactAddress:draft.pharmacy.trim(),taskHistory:[]};
requests.unshift(r);selectedId=r.id;step=7;render()}
function frame(title,subtitle,inner,stepN){return `<div class="patient"><div class="intro"><div><div class="eyebrow">Patientenportal</div><h1>${title}</h1><p>${subtitle||''}</p></div></div><div class="panel pad"><div class="stephead"><span>Rezeptanfrage</span><span>${stepN ? 'Schritt '+stepN+' von 5' : 'Ärztezentrum am Stauffacher'}</span></div>${stepN?`<div class="progress">${[1,2,3,4,5].map(i=>`<span class="${i<=stepN?'done':''}"></span>`).join('')}</div>`:''}${inner}</div><div class="foot">Ärztezentrum am Stauffacher · ${practice.phone} · Medizinische Notfälle: 144<br>Alle Daten und Kontakte sind fiktiv.</div></div>`}
function addVisit(){draft.visits.push(newVisit());render()}
function removeVisit(id){draft.visits=draft.visits.filter(v=>v.id!==id);if(!draft.visits.length)draft.visits.push(newVisit());render()}
function updateVisit(id,key,val){const v=draft.visits.find(v=>v.id===id);if(v)v[key]=val}
function visitMode(id,mode){const v=draft.visits.find(v=>v.id===id);v.mode=mode;render()}
function acceptFile(id,input){const file=input.files?.[0];if(!file)return;const v=draft.visits.find(v=>v.id===id);v.fileReady=true;v.filename=file.name;v.pisName=file.name;uploads[id]=file;render()}
function visitSummary(v){return v.mode==='upload'?'Bericht beigefügt: '+v.filename:[v.doctor,v.specialty,v.address,v.date,v.reason].filter(Boolean).join(' · ')}
function visitForm(v,i){return `<div class="visitcard"><div class="row"><b>Externe Behandlung ${i+1}</b>${draft.visits.length>1?`<button class="links" onclick="removeVisit('${v.id}')">Entfernen</button>`:''}</div><div class="choice"><button class="opt ${v.mode==='upload'?'selected':''}" onclick="visitMode('${v.id}','upload')"><b>Bericht hochladen</b><span class="symbol">${v.mode==='upload'?'✓':'○'}</span></button><button class="opt ${v.mode==='request'?'selected':''}" onclick="visitMode('${v.id}','request')"><b>Bericht durch Praxis anfordern</b><span class="symbol">${v.mode==='request'?'✓':'○'}</span></button></div>${v.mode==='upload'?`<label class="field">Bericht auswählen (PDF oder Bild)</label><input class="inp" type="file" accept=".pdf,image/*" onchange="acceptFile('${v.id}',this)">${v.fileReady?`<div class="fileline">✓ ${esc(v.filename)} · Für die Praxis vorbereitet</div>`:''}`:`<label class="field">Name der Ärztin / des Arztes oder Praxis</label><input class="inp" value="${esc(v.doctor)}" oninput="updateVisit('${v.id}','doctor',this.value)" placeholder="z. B. Dr. Lea Sommer"><label class="field">Fachrichtung</label><input class="inp" value="${esc(v.specialty)}" oninput="updateVisit('${v.id}','specialty',this.value)" placeholder="z. B. Kardiologie"><label class="field">Adresse</label><input class="inp" value="${esc(v.address)}" oninput="updateVisit('${v.id}','address',this.value)" placeholder="Strasse, PLZ und Ort"><label class="field">Grund der Behandlung</label><input class="inp" value="${esc(v.reason)}" oninput="updateVisit('${v.id}','reason',this.value)" placeholder="z. B. Verlaufskontrolle"><label class="field">Behandlungsdatum (ungefähr)</label><input class="inp" type="date" value="${esc(v.date)}" oninput="updateVisit('${v.id}','date',this.value)">`}</div>`}
function patient(){const m=meds.find(x=>x.id===draft.med);if(step===0)return frame('Rezept anfragen','Einfach, sicher und ohne Wartezeit am Telefon.',`<div class="question">Welches Medikament benötigen Sie?</div><p class="hint">Ihre in der Praxis dokumentierten Medikamente</p>${meds.map(x=>`<button class="opt" onclick="selectMed('${x.id}')"><span><b>${esc(x.name)}</b><span class="muted">${esc(x.dose)}</span></span><span class="symbol">›</span></button>`).join('')}<button class="opt" onclick="selectMed('other')"><span><b>Mein Medikament ist nicht aufgeführt</b></span><span class="symbol">›</span></button>`,'1');
if(step===4)return frame('Bereits ein gültiges Rezept','',`<div class="notice good"><b>${esc(m.name)}</b><br>Gemäss unserem Praxissystem ist für dieses Medikament noch ein gültiges Rezept vorhanden.</div><p style="margin-top:17px">Bitte kontaktieren Sie Ihre Apotheke, um zu prüfen, ob noch Bezüge möglich sind. Bei Fragen erreichen Sie unsere Praxis unter <b>${practice.phone}</b>.</p><div class="actions"><button class="btn ghost" onclick="reset()">Anderes Medikament wählen</button></div>`);
if(step===5)return frame('Neues Medikament','',`<div class="question">Dieses Medikament ist nicht in Ihrer Liste.</div><p>Bitte kontaktieren Sie unsere Praxis telefonisch, damit wir die neue Medikation gemeinsam klären können.</p><div class="notice"><b>Ärztezentrum am Stauffacher</b><br>${practice.phone}</div><div class="actions"><button class="btn ghost" onclick="reset()">Zurück zur Auswahl</button></div>`);
if(step===1)return frame('Rezept anfragen',esc(m.name),`<div class="question">Möchten Sie den Arzt über neu aufgetretene Symptome informieren?</div><button class="opt ${draft.symptoms===false?'selected':''}" onclick="draft.symptoms=false;render()"><b>Nein</b><span class="symbol">${draft.symptoms===false?'✓':'○'}</span></button><button class="opt ${draft.symptoms===true?'selected':''}" onclick="draft.symptoms=true;render()"><b>Ja</b><span class="symbol">${draft.symptoms===true?'✓':'○'}</span></button>${draft.symptoms===true?`<label class="field">Beschreiben Sie Ihre Beschwerden kurz</label><textarea class="inp" id="symptomsInput" placeholder="Ihre Beschwerden ..." oninput="draft.symptomText=this.value">${esc(draft.symptomText)}</textarea>`:''}<div class="notice">Diese Anfrage ist kein Notfallkanal. Bei dringenden medizinischen Beschwerden kontaktieren Sie die Praxis direkt telefonisch. In lebensbedrohlichen Notfällen wählen Sie <b>144</b>.</div><div class="actions"><button class="btn ghost" onclick="back()">Zurück</button><button class="btn" onclick="next()">Weiter</button></div>`,'2');
if(step===2)return frame('Rezept anfragen',esc(m.name),`<div class="question">Waren Sie seit der letzten Rezeptausstellung am 12.08.2026 bei einem anderen Arzt oder im Spital in Behandlung?</div><button class="opt ${draft.external===false?'selected':''}" onclick="draft.external=false;render()"><b>Nein</b><span class="symbol">${draft.external===false?'✓':'○'}</span></button><button class="opt ${draft.external===true?'selected':''}" onclick="draft.external=true;render()"><b>Ja</b><span class="symbol">${draft.external===true?'✓':'○'}</span></button><div class="actions"><button class="btn ghost" onclick="back()">Zurück</button><button class="btn" onclick="next()">Weiter</button></div>`,'3');
if(step===3)return frame('Externe Behandlung','Berichte einreichen oder anfordern lassen',`${draft.visits.map(visitForm).join('')}<button class="btn ghost addvisit" onclick="addVisit()">+ Weitere Behandlung hinzufügen</button><div class="actions"><button class="btn ghost" onclick="back()">Zurück</button><button class="btn" onclick="next()">Weiter</button></div>`,'3');
if(step===6)return frame('Rezeptzustellung','',`<div class="question">Wie möchten Sie Ihr Rezept erhalten?</div><button class="opt ${draft.delivery==='email'?'selected':''}" onclick="draft.delivery='email';render()"><b>Per E-Mail</b><span class="symbol">${draft.delivery==='email'?'✓':'○'}</span></button><button class="opt ${draft.delivery==='post'?'selected':''}" onclick="draft.delivery='post';render()"><b>Per Post</b><span class="symbol">${draft.delivery==='post'?'✓':'○'}</span></button><button class="opt ${draft.delivery==='pharmacy'?'selected':''}" onclick="draft.delivery='pharmacy';render()"><b>Direkt an meine Apotheke</b><span class="symbol">${draft.delivery==='pharmacy'?'✓':'○'}</span></button>${draft.delivery==='email'?`<label class="field">Hinterlegte E-Mail-Adresse prüfen</label><input class="inp" type="email" value="${esc(draft.contactEmail)}" oninput="draft.contactEmail=this.value"><p class="hint">Bitte bestätigen oder korrigieren Sie Ihre E-Mail-Adresse.</p>`:draft.delivery==='post'?`<label class="field">Hinterlegte Postadresse prüfen</label><textarea class="inp" style="min-height:75px" oninput="draft.contactAddress=this.value">${esc(draft.contactAddress)}</textarea><p class="hint">Bitte bestätigen oder korrigieren Sie Ihre Postadresse.</p>`:`<label class="field">Name und Ort Ihrer Apotheke</label><input class="inp" value="${esc(draft.pharmacy)}" oninput="draft.pharmacy=this.value" placeholder="z. B. Apotheke Stauffacher, Zürich"><p class="hint">Bitte geben Sie Ihre gewünschte Apotheke an.</p>`}<div class="actions"><button class="btn ghost" onclick="back()">Zurück</button><button class="btn" onclick="next()">Weiter</button></div>`,'4');
if(step===8)return frame('Anfrage abschliessen','',`<div class="question">Ihre Angaben im Überblick</div><div class="line"><span class="muted">Medikament</span><strong>${esc(m.name)}</strong></div><div class="line"><span class="muted">Neue Beschwerden</span><strong>${draft.symptoms?'Ja':'Nein'}</strong></div>${draft.symptoms?`<p class="hint">${esc(draft.symptomText)}</p>`:''}<div class="line"><span class="muted">Externe Behandlung</span><strong>${draft.external?'Ja · '+draft.visits.length:'Nein'}</strong></div>${draft.external?draft.visits.map((v,i)=>`<p class="hint"><b>Behandlung ${i+1}:</b> ${esc(visitSummary(v))}</p>`).join(''):''}<div class="line"><span class="muted">Rezeptzustellung</span><strong>${draft.delivery==='email'?'Per E-Mail':draft.delivery==='post'?'Per Post':'Direkt an Apotheke'}</strong></div><p class="hint">${esc(draft.delivery==='email'?draft.contactEmail:draft.delivery==='post'?draft.contactAddress:draft.pharmacy)}</p><div class="actions"><button class="btn ghost" onclick="back()">Zurück</button><button class="btn" onclick="submit()">Rezept anfragen</button></div><p class="hint">Die Ausstellung erfolgt nach ärztlicher Prüfung.</p>`,'5');
if(step===7)return frame('Anfrage eingegangen','Vielen Dank. Wir haben Ihre Anfrage erhalten.',`<div class="notice good"><b>Ihre Anfrage wurde übermittelt.</b><br>Unser Praxisteam bearbeitet diese und meldet sich bei Ihnen.</div><div class="actions"><button class="btn" onclick="reset()">Weitere Anfrage starten</button></div>`);
}
function badge(r){return r.status==='mpa'?'<span class="tag warn">MPA prüft Berichte</span>':r.status==='waiting'?'<span class="tag warn">Bericht angefordert · wartet</span>':r.status==='doctor'?'<span class="tag">Ärztliche Prüfung</span>':r.status==='fulfill'?'<span class="tag green">Rezept bereitstellen</span>':r.status==='finished'?'<span class="tag green">Abgeschlossen</span>':'<span class="tag warn">Weitere Abklärung</span>'}
function caseList(filter){const items=requests.filter(r=>filter==='all'||(filter==='mpa'?(r.status==='mpa'||r.status==='waiting'||r.status==='fulfill'||r.status==='followup'):r.status==='doctor'));return `<div class="panel queue"><div style="padding:7px 7px 12px"><b>Anfragen</b><div class="small">${items.length} Vorgänge</div></div>${items.length?items.map(r=>`<div class="queueitem ${selectedId===r.id?'active':''}" onclick="selectedId='${r.id}';taskOpen=false;render()"><div class="row"><b>${esc(r.name)}</b>${badge(r)}</div><p>${esc(r.med)}</p><div class="small">${esc(r.created)}</div></div>`).join(''):`<div class="emptystate"><b>Keine offenen Vorgänge</b><div>Starten Sie eine Anfrage im Patientenportal.</div></div>`}</div>`}
function demoData(){if(requests.length)return;const a={name:'Anna Keller',age:68,created:today(),signed:false,task:null,comment:'',dose:'1 Tablette morgens'};
const v1={...newVisit(),mode:'request',doctor:'Dr. Lea Sommer',specialty:'Kardiologie',address:'Sonnenrainstrasse 14, 8008 Zürich',reason:'Verlaufskontrolle',date:'2026-10-15'};
const v2={...newVisit(),mode:'upload',filename:'Kardiologiebericht_Oktober.pdf',pisName:'Kardiologiebericht_Oktober.pdf',fileReady:true};
requests=[{...a,delivery:'email',contact:'anna.keller@beispiel.ch',taskHistory:[],id:uid(),med:'Ramipril 5 mg',symptoms:true,symptomText:'Manchmal Schwindel beim Aufstehen.',external:true,visits:[v1,v2],status:'mpa',report:'MPA-Prüfung'},{...a,delivery:'post',contact:'Lindenstrasse 18, 8003 Zürich',taskHistory:[],id:uid(),med:'Bisoprolol 5 mg',symptoms:false,symptomText:'',external:false,visits:[],status:'doctor',report:'nicht erforderlich'}];selectedId=requests[0].id;render()}
function staffIntro(title,desc){return `<div class="intro"><div><div class="eyebrow">Ärztezentrum am Stauffacher</div><h1>${title}</h1><p>${desc}</p></div><div class="toptools"><button class="btn ghost tiny" onclick="demoData()">Beispielfälle laden</button><button class="btn ghost tiny" onclick="clearData()">Zurücksetzen</button></div></div>`}
function clearData(){requests=[];selectedId=null;render()}
function staffSelected(filter){let items=requests.filter(r=>filter==='mpa'?(r.status==='mpa'||r.status==='waiting'||r.status==='fulfill'||r.status==='followup'):r.status==='doctor');let found=items.find(r=>r.id===selectedId)||items[0];if(found)selectedId=found.id;return found}
function mpa(){const eligible=requests.filter(r=>['mpa','waiting','fulfill','followup'].includes(r.status));const inDoctor=requests.filter(r=>r.status==='doctor');const all=[...eligible,...inDoctor];const r=all.find(x=>x.id===selectedId)||all[0];if(r)selectedId=r.id;
 const groups=`<div class="panel queue"><div class="queue-group-title"><b>Bearbeitung durch MPA</b><span class="tag">${eligible.length}</span></div>${queueRows(eligible)}<div class="queue-group-title"><b>Beim Arzt</b><span class="tag">${inDoctor.length}</span></div>${queueRows(inDoctor)}</div>`;
 return staffIntro('MPA · Gesamtübersicht','Alle offenen Anfragen und ihre aktuelle Zuständigkeit.')+`<div class="dashgrid">${groups}<div>${r?(r.status==='doctor'?mpaReadOnly(r):mpaCase(r)):`<div class="panel emptystate"><b>Keine offenen Anfragen</b><p>Neue Anfragen erscheinen automatisch hier.</p></div>`}</div></div><div class="foot">Ärztezentrum am Stauffacher · Fiktive Patientendaten</div>`}
function queueRows(items){return items.length?items.map(r=>`<div class="queueitem ${selectedId===r.id?'active':''}" onclick="selectedId='${r.id}';taskOpen=false;render()"><div class="row"><b>${esc(r.name)}</b>${badge(r)}</div><p>${esc(r.med)}</p><div class="small">${esc(r.created)}</div></div>`).join(''):`<div class="small" style="padding:12px">Keine Anfragen in dieser Rubrik</div>`}
function mpaReadOnly(r){return `<div class="panel pad"><div class="caseheader"><div><h2>${esc(r.name)} · ${r.age} Jahre</h2><div class="small">${esc(r.med)} · ${esc(r.created)}</div></div>${badge(r)}</div><div class="notice"><b>Beim Arzt zur Prüfung</b><br>Die Anfrage ist aktuell der ärztlichen Prüfung zugeteilt. Für die MPA sind momentan keine Arbeitsschritte offen.</div>${r.comment?`<div class="notice">${esc(r.comment)}</div>`:''}</div>`}
function mpaCase(r){return `<div class="panel pad"><div class="caseheader"><div><h2>${esc(r.name)} · ${r.age} Jahre</h2><div class="small">${esc(r.med)} · ${esc(r.created)}</div></div>${badge(r)}</div>${r.status==='mpa'||r.status==='waiting'?`<div class="notice ${r.status==='waiting'?'warn':''}"><b>Externe Behandlungen · ${r.visits.length} Eintrag/Einträge</b><br>Alle Berichte prüfen und im PIS zuordnen. Erst nach Abschluss an den Arzt weiterleiten.</div>${r.visits.map((v,i)=>mpaVisit(r,v,i)).join('')}<div class="actions"><button class="btn" ${r.visits.every(v=>v.status==='done')?'':'disabled'} onclick="forward('${r.id}')">An Arzt weiterleiten</button></div>`:r.status==='followup'?`<div class="taskbox"><h3>Ärztlicher Auftrag</h3><p>${esc(r.task?.label||'Weitere Abklärung')}</p>${r.task?.params?`<p class="small">Angaben: ${esc(r.task.params)}</p>`:''}</div><label class="field">Rückfrage (falls erforderlich)</label><textarea id="mpaQuestion" class="inp" placeholder="Ihre Rückfrage an den Arzt …"></textarea><div class="actions"><button class="btn success" onclick="taskCompleted('${r.id}')">Erledigt</button><button class="btn ghost" onclick="taskQuestion('${r.id}')">Rückfrage an Arzt</button></div>`:r.status==='fulfill'?`<div class="notice good"><b>Ärztliche Verordnung bestätigt</b><br>Bitte das im PIS signierte Rezept gemäss Patientenwunsch bereitstellen.</div><div class="deliverybox"><div class="small">GEWÜNSCHTE REZEPTZUSTELLUNG</div><h3>${r.delivery==='email'?'Per E-Mail':r.delivery==='post'?'Per Post':'Direkt an Apotheke'}</h3><div>${esc(r.contact||'Nicht angegeben')}</div><p class="small">Zustellangaben vom Patienten bestätigt. Sicheren Versandweg prüfen.</p></div><div class="actions"><button class="btn success" onclick="finish('${r.id}')">Bereitstellung abschliessen</button></div>`:''}${r.comment?`<div class="notice"><b>Hinweis</b><br>${esc(r.comment)}</div>`:''}</div>`}
function mpaVisit(r,v,i){return `<div class="visitcard"><div class="row"><b>Behandlung ${i+1}</b><span class="tag ${v.status==='done'?'green':v.status==='requested'?'warn':''}">${v.status==='done'?'Im PIS zugeordnet':v.status==='requested'?'Bericht angefordert':'Offen'}</span></div>${v.mode==='request'?`<div class="small">${esc(v.doctor)} · ${esc(v.specialty)}<br>${esc(v.address)}<br>${esc(v.date)} · ${esc(v.reason)}</div><button class="links" onclick="pisLink('Dokumentenablage von ${esc(r.name)}')">Dokumentenablage im PIS öffnen</button>${v.status==='new'?`<div class="actions wrap"><button class="btn ghost" onclick="markExisting('${r.id}','${v.id}')">Bericht bereits im PIS</button><button class="btn" onclick="markRequested('${r.id}','${v.id}')">Bericht angefordert</button></div>`:''}${v.status==='requested'?`<div class="notice warn"><b>Warten auf Bericht</b><br>Die Bearbeitung ist pausiert. Sobald der Bericht eintrifft, im PIS zuordnen.</div><div class="actions"><button class="btn ghost" onclick="markExisting('${r.id}','${v.id}')">Bericht eingetroffen · im PIS zuordnen</button></div>`:''}`:`<div class="small">Vom Patienten beigefügt: ${esc(v.filename||'Bericht')}</div>${v.status!=='done'?`<label class="field">Dateiname für die Ablage im PIS</label><input class="inp" value="${esc(v.pisName||v.filename)}" oninput="setPisName('${r.id}','${v.id}',this.value)"><div class="actions"><button class="btn" onclick="uploadPis('${r.id}','${v.id}')">Im PIS ablegen · an Arzt vorbereiten</button></div>`:`<div class="notice good">Datei zur PIS-Ablage bestätigt: ${esc(v.pisName)}</div>`}`}</div>`}
function getVisit(rid,vid){const r=requests.find(r=>r.id===rid);return {r,v:r?.visits.find(v=>v.id===vid)}}
function syncReportStatus(r){const done=r.visits.every(v=>v.status==='done');const waiting=r.visits.some(v=>v.status==='requested');r.status=done?'mpa':waiting?'waiting':'mpa';r.report=done?'alle zugeordnet':waiting?'Bericht angefordert':'MPA-Prüfung'}
function markExisting(rid,vid){const {r,v}=getVisit(rid,vid);if(!v)return;v.status='done';v.pisName=v.pisName||'Externer Bericht';syncReportStatus(r);render()}
function markRequested(rid,vid){const {r,v}=getVisit(rid,vid);if(!v)return;v.status='requested';syncReportStatus(r);render()}
function setPisName(rid,vid,name){const {v}=getVisit(rid,vid);if(v)v.pisName=name}
function uploadPis(rid,vid){const {r,v}=getVisit(rid,vid);if(!v?.pisName?.trim())return alert('Bitte einen Dateinamen angeben.');v.status='done';syncReportStatus(r);r.comment='MPA: Hochgeladene Datei «'+v.pisName+'» für die PIS-Ablage bestätigt (Simulation).';render()}
function reportFound(id){const r=requests.find(x=>x.id===id);r.report='vorhanden';r.status='doctor';r.comment='MPA: Externen Bericht im PIS geprüft und zugeordnet.';nav('doctor')}
function reportMissing(id){const r=requests.find(x=>x.id===id);r.report='angefordert';r.comment='MPA: Bericht bei '+r.doctor+' angefordert. Rückmeldung steht aus.';render()}
function forward(id){const r=requests.find(x=>x.id===id);if(!r?.visits.every(v=>v.status==='done'))return alert('Bitte zuerst alle Berichte prüfen oder zuordnen.');r.status='doctor';r.report='alle zugeordnet';r.comment='MPA: Alle externen Berichte geprüft und im PIS zugeordnet.';nav('doctor')}
function taskCompleted(id){const r=requests.find(x=>x.id===id);if(!r)return;r.taskHistory.push('Erledigt: '+(r.task?.label||'Aufgabe'));r.task=null;r.status='finished';r.comment='MPA: Auftrag abgeschlossen.';selectedId=null;render()}
function taskQuestion(id){const r=requests.find(x=>x.id===id);if(!r)return;const question=document.getElementById('mpaQuestion')?.value?.trim();if(!question)return alert('Bitte eine Rückfrage eingeben.');r.comment='MPA – Rückfrage an Arzt: '+question;r.taskHistory.push(r.comment);r.task=null;r.status='doctor';selectedId=r.id;nav('doctor')}
function finish(id){const r=requests.find(x=>x.id===id);r.status='finished';alert('Der Vorgang wurde als abgeschlossen markiert. Es wurde kein echtes Rezept erstellt.');render()}
function doctor(){const r=staffSelected('doctor');return staffIntro('Ärztliche Prüfung','Alle wichtigen Informationen auf einen Blick.')+`<div class="dashgrid">${caseList('doctor')}<div>${r?doctorCase(r):`<div class="panel emptystate"><b>Keine ärztlichen Prüfungen offen</b><p>Gesendete Anfragen ohne externe Behandlung erscheinen direkt hier.</p></div>`}</div></div><div class="foot">Ärztezentrum am Stauffacher · Medizinische Werte sind fiktiv. Keine automatische klinische Beurteilung.</div>`}
function doctorCase(r){return `<div class="panel pad"><div class="caseheader"><div><h2>${esc(r.name)} · ${r.age} Jahre</h2><div class="small">Rezeptanfrage · ${esc(r.created)}</div></div>${badge(r)}</div><div class="medhero"><div class="small">ANGEFORDERTES MEDIKAMENT</div><b>${esc(r.med)}</b><div class="small">${esc(r.dose)} · Kein gültiges Rezept im simulierten PIS</div></div>${r.symptoms?`<div class="notice warn" style="margin:0 0 16px"><b>Neue Symptome angegeben</b><br>${esc(r.symptomText)}<div class="small" style="margin-top:5px">Unveränderte Patientenangabe · ärztlich zu beurteilen</div></div>`:''}${r.external?`<div class="notice" style="margin:0 0 16px"><b>Externe Behandlung:</b> ${r.visits.map(v=>esc(v.doctor||v.filename||'Hochgeladener Bericht')).join(', ')}<br><span class="small">Berichtstatus: ${esc(r.report)}</span></div>`:''}<div class="four"><div class="stat"><h3><span class="ico">▦</span> Letzte Termine</h3><div class="line"><span>15.09.2026</span><span class="muted">Hausarztkontrolle</span></div><div class="line"><span>18.06.2026</span><span class="muted">Blutdruckkontrolle</span></div><button class="links" onclick="pisLink('Termine')">Alle Termine im PIS ansehen</button></div><div class="stat"><h3><span class="ico">⌁</span> Relevante Laborwerte</h3>${r.med.includes('Atorvastatin')?`<div class="labrow"><span>15.09.26 · LDL</span><strong>2,1 mmol/l</strong><span class="muted">Ref. &lt; 3,0</span></div><div class="labrow"><span>15.09.26 · ALT</span><strong>24 U/l</strong><span class="muted">Ref. 10–35</span></div>`:`<div class="labrow"><span>15.09.26 · Kreatinin</span><strong>82 µmol/l</strong><span class="muted">Ref. 45–90</span></div><div class="labrow"><span>15.09.26 · Kalium</span><strong>4,3 mmol/l</strong><span class="muted">Ref. 3,5–5,1</span></div><div class="labrow"><span>15.09.26 · eGFR</span><strong>72 ml/min/1,73 m²</strong><span class="muted">Ref. ≥ 60*</span></div>`}<div class="small" style="margin-top:8px">Beispiel-Referenzbereiche · *eGFR kontextabhängig</div><button class="links" onclick="pisLink('Laborbefund')">Befund im PIS öffnen</button></div><div class="stat"><h3><span class="ico">✚</span> Medikationsliste</h3><div class="line"><span>Ramipril 5 mg</span><span class="muted">morgens</span></div><div class="line"><span>Atorvastatin 20 mg</span><span class="muted">abends</span></div><div class="line"><span>Bisoprolol 5 mg</span><span class="muted">morgens</span></div><button class="links" onclick="pisLink('Medikationsliste')">Medikationsliste im PIS öffnen</button></div><div class="stat"><h3><span class="ico">▤</span> Letzte Berichte</h3>${r.external&&r.report==='alle zugeordnet'?`<div class="line"><span>Externer Bericht</span><span class="tag green">Zugeordnet</span></div><button class="links" onclick="pisLink('Externer Arztbericht')">Externen Bericht im PIS öffnen</button>`:r.external?`<div class="line"><span>Externer Bericht</span><span class="tag warn">${esc(r.report)}</span></div>`:''}<div class="line"><span>Hausarztbericht</span><span class="muted">15.09.2026</span></div><button class="links" onclick="pisLink('Arztberichte')">Dokumentenablage im PIS öffnen</button></div></div>${r.comment?`<div class="notice"><b>Letzte Bearbeitung</b><br>${esc(r.comment)}</div>`:''}<div class="hr"></div><h3>Ärztliche Entscheidung</h3><div class="two"><button class="btn success" onclick="approve('${r.id}')">Verordnung bestätigen</button><button class="btn ghost" onclick="taskOpen=!taskOpen;render()">Aufgabe an MPA</button></div>${taskOpen?taskForm(r):''}<p class="small" style="margin-top:11px">Die ärztliche Freigabe und Signatur erfolgen im realen PIS. RxFlow übernimmt anschliessend die administrative Weiterleitung.</p></div>`}
function taskForm(r){return `<div class="taskbox" style="margin-top:15px"><h3>Aufgabe erstellen</h3><label><input type="radio" name="task" value="blood" checked onchange="taskChoice()"> Termin für Blutentnahme vereinbaren</label><label><input type="radio" name="task" value="consult" onchange="taskChoice()"> Termin für Blutentnahme und Besprechung</label><label><input type="radio" name="task" value="custom" onchange="taskChoice()"> Eigene Aufgabe</label><label class="field" id="taskLabel">Gewünschte Laborparameter</label><textarea class="inp" id="taskParams" placeholder="z. B. Kreatinin, eGFR, Kalium"></textarea><div class="actions"><button class="btn ghost" onclick="taskOpen=false;render()">Abbrechen</button><button class="btn" onclick="sendTask('${r.id}')">An MPA senden</button></div></div>`}
function taskChoice(){const choice=document.querySelector('input[name=task]:checked')?.value;$('#taskLabel').textContent=choice==='custom'?'Aufgabenbeschreibung':'Gewünschte Laborparameter';$('#taskParams').placeholder=choice==='custom'?'Aufgabe für das Praxisteam beschreiben':'z. B. Kreatinin, eGFR, Kalium'}
function sendTask(id){const choice=document.querySelector('input[name=task]:checked')?.value;const params=$('#taskParams').value.trim();if(!params)return alert('Bitte geben Sie '+(choice==='custom'?'die Aufgabe':'die Laborparameter')+' an.');const r=requests.find(x=>x.id===id);const label=choice==='blood'?'Termin für Blutentnahme vereinbaren':choice==='consult'?'Termin für Blutentnahme und ärztliche Besprechung vereinbaren':'Eigene Aufgabe';r.task={label,params};r.status='followup';r.comment='Arzt: '+label;taskOpen=false;nav('mpa')}
function approve(id){const r=requests.find(x=>x.id===id);if(!confirm('Bestätigen, dass die Verordnung ärztlich im PIS geprüft und signiert wurde? (Simulation)'))return;r.signed=true;r.status='fulfill';r.comment='Arzt: Verordnung bestätigt. MPA soll das signierte Rezept bereitstellen.';nav('mpa')}
function pisLink(what){alert(what+': In der echten Anwendung öffnet sich der entsprechende Datensatz im PIS. Hier ist kein PIS verbunden.')}
function render(){if(view==='patient')$('#app').innerHTML=patient();else if(view==='mpa')$('#app').innerHTML=mpa();else $('#app').innerHTML=doctor();document.getElementById('langSelect').value=language;localize()};
